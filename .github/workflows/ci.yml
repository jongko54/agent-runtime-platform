name: Runtime checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      # All DB tests create disposable PostgreSQL 17 containers; no external credentials.
      - run: uv run pytest -q
      - run: docker compose config --quiet
