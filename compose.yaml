name: agent-runtime-platform
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: runtime_admin
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime_admin -d agent_runtime"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - runtime-postgres:/var/lib/postgresql/data
      - ./scripts/init-local.sql:/docker-entrypoint-initdb.d/001-runtime.sql:ro

volumes:
  runtime-postgres:
