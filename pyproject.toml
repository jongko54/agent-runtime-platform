[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-platform"
version = "0.1.0"
description = "Multi-tenant agent runtime with durable PostgreSQL acceptance"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.19.1,<2",
  "fastapi>=0.141.1,<1",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15,<3",
  "psycopg[binary,pool]>=3.3.5,<4",
  "sqlalchemy[asyncio]>=2.0.52,<2.1",
  "uvicorn[standard]>=0.52.4,<1",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3", "httpx>=0.28.1,<1", "hypothesis>=6.167.1,<7",
  "pyright>=1.1.411,<2", "pytest>=9.1.1,<10", "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.6,<1", "testcontainers[postgres]>=4.15,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
